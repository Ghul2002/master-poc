substitutions:
  _IMAGE: "europe-north2-docker.pkg.dev/${PROJECT_ID}/daas-poc/daas-poc"

steps:
  - id: Budowanie obrazu
    name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_IMAGE}:$BUILD_ID", "."]

  - id: Testy
    name: gcr.io/cloud-builders/docker
    args: ["run", "--rm", "${_IMAGE}:$BUILD_ID", "pytest", "-q"]

  - id: Publikacja
    name: gcr.io/cloud-builders/docker
    args: ["push", "${_IMAGE}:$BUILD_ID"]

options:
  dynamicSubstitutions: true
  logging: CLOUD_LOGGING_ONLY