version: 0.2

env:
  variables:
    IMAGE_REPO: "daas-poc"

phases:
  pre_build:
    commands:
      - ECR_REGISTRY=$(aws sts get-caller-identity --query Account --output text).dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY
  build:
    commands:
      - docker build -t $ECR_REGISTRY/$IMAGE_REPO:$CODEBUILD_BUILD_NUMBER .
      - docker run --rm $ECR_REGISTRY/$IMAGE_REPO:$CODEBUILD_BUILD_NUMBER pytest -q
      - docker push $ECR_REGISTRY/$IMAGE_REPO:$CODEBUILD_BUILD_NUMBER